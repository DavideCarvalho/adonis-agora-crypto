name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm check:package

      # The copy checks only make sense once the server package (which carries the canonical
      # agora:doctor and crypto-kit copies) exists; this branch lands the contract and the client.
      - name: Check the agora:doctor and crypto-kit copies
        run: |
          if [ -d packages/adonis/src/crypto-kit ]; then
            pnpm --filter @adonis-agora/crypto check:agora-doctor
            pnpm --filter @adonis-agora/crypto check:crypto-kit
          else
            echo "No @adonis-agora/crypto package on this branch yet: skipping the copy checks."
          fi

  # Lint, typecheck and build run once on the pinned version above; only the test suite fans out
  # across every Node line the ecosystem supports (both maintained lines accepted by AdonisJS 7).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
